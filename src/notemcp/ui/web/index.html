<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lapidary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <div class="brand"><img src="logo-mark.png" alt="" class="brand-mark">Lapidary</div>
  <div class="bar-right">
    <label class="field">
      <span>Model</span>
      <select id="provider"></select>
    </label>
    <button id="history-btn" class="ghost">History<span id="pending-badge" class="badge hidden"></span></button>
    <button id="theme" class="ghost" title="Toggle theme">◐</button>
  </div>
</header>

<aside id="history" class="drawer hidden">
  <div class="drawer-head">
    <h2>History</h2>
    <div class="drawer-actions">
      <button id="retry" class="ghost hidden">Resend pending</button>
      <button id="history-close" class="ghost">✕</button>
    </div>
  </div>
  <ul id="history-list" class="history-list"></ul>
</aside>
<div id="scrim" class="scrim hidden"></div>

<div id="config-warning" class="banner hidden"></div>

<main class="panes">

  <section class="pane" id="pane-input">
    <div class="pane-head">
      <h2>Raw note</h2>
      <span class="hint-count" id="raw-count">0 characters</span>
    </div>
    <textarea id="raw" placeholder="Paste your messy note here — meeting minutes, a loose idea, a code snippet, whatever it is.

Ctrl+Enter formats."></textarea>
    <label class="field wide">
      <span>Extra instruction (optional)</span>
      <input id="hint" type="text" placeholder="e.g. extract the action items with their owners">
    </label>
    <div class="pane-foot">
      <button id="format" class="primary">Format</button>
    </div>
  </section>

  <section class="pane" id="pane-draft">
    <div class="pane-head">
      <h2>Draft</h2>
      <div class="tabs">
        <button data-tab="preview" class="tab active">Preview</button>
        <button data-tab="source" class="tab">Markdown</button>
      </div>
    </div>

    <div id="empty" class="empty">
      <img src="logo-lockup-dark.png" alt="Lapidary" class="empty-logo on-dark">
      <img src="logo-lockup-light.png" alt="Lapidary" class="empty-logo on-light">
      <p>The formatted result shows up here.</p>
      <p class="dim">You can edit everything before publishing.</p>
    </div>

    <div id="draft" class="hidden">
      <input id="title" class="title-input" placeholder="Title">
      <div class="meta">
        <label class="field">
          <span>Type</span>
          <select id="doc_type">
            <option value="nota">Note</option><option value="reuniao">Meeting</option><option value="ideia">Idea</option>
            <option value="tarefa">Task</option><option value="referencia">Reference</option><option value="resumo">Summary</option>
          </select>
        </label>
        <label class="field grow">
          <span>Tags</span>
          <input id="tags" type="text" placeholder="comma-separated">
        </label>
      </div>
      <input id="summary" class="summary-input" placeholder="Summary">

      <div id="preview" class="body preview"></div>
      <textarea id="source" class="body hidden" spellcheck="false"></textarea>

      <div class="pane-foot">
        <label class="field">
          <span>Destination</span>
          <select id="destination"></select>
        </label>
        <div class="parent-chain-row">
          <div id="parent-chain" class="parent-chain"></div>
          <button id="chain-reload" class="ghost chain-icon-btn" type="button" title="Reload current level" disabled>↻</button>
          <button id="chain-add" class="ghost chain-icon-btn" type="button" title="Create a subpage here" disabled>+</button>
        </div>
        <span id="parent-page-label" class="dim parent-page-label">Page: root</span>
        <div id="chain-create" class="chain-create hidden">
          <input id="chain-create-title" type="text" placeholder="New subpage name">
          <button id="chain-create-btn" class="ghost">Create</button>
          <button id="chain-create-cancel" class="ghost">Cancel</button>
        </div>
        <div id="chain-duplicate" class="chain-duplicate hidden">
          <p id="chain-duplicate-msg"></p>
          <div id="chain-duplicate-actions" class="chain-duplicate-actions"></div>
        </div>
        <button id="publish" class="primary">Publish to Notion</button>
      </div>
    </div>
  </section>

</main>

<div id="busy" class="busy hidden"><div class="spinner"></div><span id="busy-label"></span></div>
<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
